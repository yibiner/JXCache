# 水滴服务节点1配置
server:
  port: 18082

spring:
  application:
    name: water

# JetCache 配置
jetcache:
  statIntervalMinutes: 15
  areaInCacheName: true
  local:
    default:
      type: caffeine
      keyConvertor: fastjson2
    water:
      type: caffeine
      keyConvertor: fastjson2

# JXCache Observer 配置
jxc:
  observer:
    enabled: true
    maxPageSize: 200
    maxValuePreview: 200
    totalShards: 8

# 日志配置
logging:
  level:
    dev.yibin.samples.waterdroplets: INFO
    com.alicp.jetcache: WARN
    dev.yibin.jxcache: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [NODE2] %logger{36} - %msg%n"
